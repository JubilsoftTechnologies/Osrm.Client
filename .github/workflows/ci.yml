name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Src/Osrm.Client.sln

      - name: Build
        run: dotnet build Src/Osrm.Client.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Src/Osrm.Client.Tests/Osrm.Client.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack Src/Osrm.Client/Osrm.Client.csproj --configuration Release --no-build -p:ContinuousIntegrationBuild=true --output artifacts

      - name: Validate package artifacts
        run: |
          ls artifacts/*.nupkg
          ls artifacts/*.snupkg
          unzip -l artifacts/*.nupkg | grep -q "lib/net9.0/Osrm.Client.dll"
          unzip -l artifacts/*.nupkg | grep -q "lib/netstandard2.0/Osrm.Client.dll"
          unzip -l artifacts/*.nupkg | grep -q "README.md"
          unzip -l artifacts/*.nupkg | grep -q "LICENSE.md"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*
          if-no-files-found: error
